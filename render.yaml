# Render Blueprint for CodeForge-AI
# Services are built fresh in isolation on Render — no local port conflicts.
#
# Secret handling:
#  - SECRET_KEY uses generateValue: true: Render creates a strong random value
#    on first deploy (no value or sync flag is specified for it).
#  - OPENROUTER_API_KEY and SMTP_* are marked sync: false with NO value here:
#    set them in Render's dashboard (Environment tab) after first deploy, or
#    existing dashboard values are preserved. A blueprint entry with both
#    `value` and `sync: false` is invalid, and REPLACE_WITH_* placeholders
#    would be treated as literal values. Never commit real secrets.

databases:
  - name: codeforge-db
    region: oregon
    databaseName: codeforge
    user: codeforge
    plan: free
    ipAllowList: [] # allow only internal apps

services:
  # ---- Backend API (FastAPI) ----
  - type: web
    name: codeforge-backend
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codeforge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-3.5-haiku
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: FRONTEND_ORIGIN
        value: https://codeforge-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://codeforge-frontend.onrender.com
      # SMTP is optional: leave SMTP_HOST empty in the dashboard to disable it
      # (password-reset email then falls back gracefully).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
    healthCheckPath: /api/health

  # ---- Frontend (React / Nginx) ----
  - type: web
    name: codeforge-frontend
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_URL
        value: https://codeforge-backend.onrender.com/api
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
