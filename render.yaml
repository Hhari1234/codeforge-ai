# Render Blueprint for CodeForge-AI
# Services are built fresh in isolation on Render — no local port conflicts.
#
# Secret handling:
#  - SECRET_KEY uses generateValue: true: Render creates a strong random value
#    on first deploy (no value or sync flag is specified for it).
#  - OPENROUTER_API_KEY and SMTP_* are marked sync: false with NO value here:
#    set them in Render's dashboard (Environment tab) after first deploy, or
#    existing dashboard values are preserved. A blueprint entry with both
#    `value` and `sync: false` is invalid, and REPLACE_WITH_* placeholders
#    would be treated as literal values. Never commit real secrets.

databases:
  - name: codeforge-db
    region: oregon
    databaseName: codeforge
    user: codeforge
    plan: free
    ipAllowList: [] # allow only internal apps

services:
  # ---- Backend API (FastAPI) ----
  - type: web
    name: codeforge-backend
    runtime: docker
    plan: free
    region: oregon
    # Monorepo layout: rootDir anchors ALL build settings to ./backend, so
    # dockerfilePath: ./Dockerfile resolves to backend/Dockerfile and
    # dockerContext: . to ./backend. The Dockerfile's COPYs (app/, alembic/,
    # requirements.txt) are relative to that context. Files outside the root
    # directory are not available at build time.
    rootDir: ./backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codeforge-db
          property: connectionString
      # SECRET_KEY is a dashboard-provided secret, NOT generated or stored in
      # the repo. generateValue: true cannot work here: this service already
      # has the variable (created during the original Blueprint setup), and
      # Render only generates values for variables that do not yet exist.
      # sync: false means Blueprint syncs never touch it. Set a strong random
      # value in the Render dashboard (Service -> Environment -> SECRET_KEY).
      - key: SECRET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: FRONTEND_ORIGIN
        value: https://codeforge-frontend-s5xw.onrender.com
      - key: FRONTEND_URL
        value: https://codeforge-frontend-s5xw.onrender.com
      # SMTP is optional: leave SMTP_HOST empty in the dashboard to disable it
      # (password-reset email then falls back gracefully).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
    healthCheckPath: /api/health

  # ---- Frontend (React / Nginx) ----
  - type: web
    name: codeforge-frontend
    runtime: docker
    plan: free
    region: oregon
    envVars:
      # PORT is injected by Render automatically (nginx template listens on it).
      # BACKEND_UPSTREAM is the REAL backend service URL on Render. The nginx
      # template resolves it at request time (never at startup), so the
      # frontend starts even if the backend service is briefly unavailable.
      # The SPA calls the same-origin relative path /api, which nginx proxies
      # here - no CORS, no baked-in backend host, no secrets.
      - key: BACKEND_UPSTREAM
        value: https://codeforge-backend-u513.onrender.com
      - key: NGINX_RESOLVER
        value: 8.8.8.8
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
