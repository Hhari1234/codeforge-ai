# Nginx config template for CodeForge-AI (rendered by the official nginx
# entrypoint via envsubst because it lives in /etc/nginx/templates/).
# Substituted at CONTAINER START from environment variables:
#   ${PORT}             - listener port (Render injects PORT; Docker Compose
#                         uses the image default of 80)
#   ${NGINX_RESOLVER}   - DNS resolver used to look up the backend host
#   ${BACKEND_UPSTREAM} - backend base URL WITHOUT trailing slash or URI
#                         (e.g. http://backend:8000 in Docker Compose,
#                          https://codeforge-backend.onrender.com on Render)
#
# The backend is resolved at REQUEST time via `resolver` + a variable in
# proxy_pass, NOT at config load. This is what lets nginx start cleanly when
# the backend hostname is temporarily unavailable (e.g. split Render web
# services, where the Docker Compose hostname "backend" does not exist).
server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver ${NGINX_RESOLVER} valid=10s;
    set $backend_upstream ${BACKEND_UPSTREAM};

    # SPA routing: unknown paths fall back to index.html so client-side
    # routes keep working on refresh/deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy (/api in the browser is routed to the backend).
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        # Forward the UPSTREAM host, not $host: Render serves backend and
        # frontend from different onrender.com hosts through a Cloudflare
        # edge that routes by Host header. Sending $host (the frontend URL)
        # would 403. FastAPI ignores Host, so this is harmless in Compose.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
